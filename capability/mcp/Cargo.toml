[package]
name = "forge-mcp"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
forge-core = { path = "../../core/runtime" }
forge-exec = { path = "../../execution/runtime" }
forge-cap = { path = "../registry" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["process", "io-util", "time", "rt"] }

# forge-mcp-server binary 专用（不构成循环：这些 crate 不依赖 forge-mcp）
forge-tools-parsing = { path = "../../tools/parsing", optional = true }
forge-tools-text = { path = "../../tools/text", optional = true }
forge-tools-zl = { path = "../../tools/zl", optional = true }
forge-sdk = { path = "../../sdk", optional = true }
forge-sandbox = { path = "../../execution/sandbox", optional = true }
forge-evidence = { path = "../../verification/evidence", optional = true }
forge-verify = { path = "../../verification/verifier", optional = true }
forge-workspace = { path = "../../execution/workspace", optional = true }
forge-recovery = { path = "../../recovery", optional = true }
forge-task = { path = "../../core/task", optional = true }
async-trait = { version = "0.1", optional = true }

[[bin]]
name = "mock-mcp-server"
path = "src/bin/mock_mcp_server.rs"

[[bin]]
name = "forge-mcp-server"
path = "src/bin/forge_mcp_server/main.rs"
required-features = ["server-bin"]

[features]
server-bin = [
  "dep:forge-tools-parsing",
  "dep:forge-tools-text",
  "dep:forge-tools-zl",
  "dep:forge-sdk",
  "dep:forge-sandbox",
  "dep:forge-evidence",
  "dep:forge-verify",
  "dep:forge-workspace",
  "dep:forge-recovery",
  "dep:forge-task",
  "dep:async-trait",
]

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread", "process", "io-util", "time"] }