[package]
name = "forge-mcp"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
forge-core = { path = "../../core/runtime" }
forge-exec = { path = "../../execution/runtime" }
forge-cap = { path = "../registry" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["process", "io-util", "time"] }

[[bin]]
name = "mock-mcp-server"
path = "src/bin/mock_mcp_server.rs"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread", "process", "io-util", "time"] }
