[package]
name = "forge-tools-search"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "搜索工具（grep / glob）"

[dependencies]
forge-core = { path = "../../core/runtime" }
forge-exec = { path = "../../execution/runtime" }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
async-trait = "0.1"
regex = "1"
glob = "0.3"
tokio = { version = "1", features = ["full"] }

[dev-dependencies]
tempfile = "3"
