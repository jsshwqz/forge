[package]
name = "forge-tools-metatool"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "Self-evolution meta-tool: auto-wrap old forge tools into new forge Tool trait"

[dependencies]
forge-core = { path = "../../core/runtime" }
forge-exec = { path = "../../execution/runtime" }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
async-trait = "0.1"

[dev-dependencies]
tempfile = "3"
