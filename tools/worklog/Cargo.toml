[package]
name = "forge-worklog"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "多 AI 协作工作记录管理（Rust 实现）"

[dependencies]
forge-core = { path = "../../core/runtime" }
forge-exec = { path = "../../execution/runtime" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
async-trait = "0.1"
clap = { version = "4", features = ["derive"] }
chrono = { version = "0.4", features = ["serde"] }
dirs = "6"

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt"] }
