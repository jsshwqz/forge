[package]
name = "forge-tools-text"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "文本工具（markdown_render / text_toon / text_diff / text_wordcount + 4 AI 壳 + text_embed 占位）"

[dependencies]
forge-core = { path = "../../core/runtime" }
forge-exec = { path = "../../execution/runtime" }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
async-trait = "0.1"
tokio = { version = "1", features = ["full"] }
similar = "3.1"
pulldown-cmark = "0.13"

[dev-dependencies]
tempfile = "3"
