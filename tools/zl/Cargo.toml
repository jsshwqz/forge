[package]
name = "forge-tools-zl"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "P0/P1 sensing & strategy layer tools (check_sufficiency, verify_result, compile_contract, detect_drift, contradiction_analyze)"

[dependencies]
forge-core = { path = "../../core/runtime" }
forge-exec = { path = "../../execution/runtime" }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
async-trait = "0.1"

[dev-dependencies]
tempfile = "3"
