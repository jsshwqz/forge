[package]
name = "forge-tools-fs"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "文件系统工具（read_file / write_file / edit_file / exec_command）"

[dependencies]
forge-core = { path = "../../core/runtime" }
forge-exec = { path = "../../execution/runtime" }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
async-trait = "0.1"

[dev-dependencies]
tempfile = "3"
forge-sandbox = { path = "../../execution/sandbox" }
