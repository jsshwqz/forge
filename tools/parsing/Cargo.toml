[package]
name = "forge-tools-parsing"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "解析工具（yaml_parse / json_parse / toml_parse / csv_parse / pdf_parse）"

[dependencies]
forge-core = { path = "../../core/runtime" }
forge-exec = { path = "../../execution/runtime" }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
async-trait = "0.1"
tokio = { version = "1", features = ["full"] }
yaml-rust2 = "0.11"
toml = "1.1"
csv = "1.4"
pdf-extract = "0.12"

[dev-dependencies]
tempfile = "3"
