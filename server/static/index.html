<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<title>Aion Forge · 工作台</title>
<style>
  body{font-family:system-ui,sans-serif;margin:0;background:#0f1115;color:#e6e6e6}
  nav{background:#161a22;padding:12px 20px;display:flex;gap:18px}
  nav a{color:#7aa2f7;text-decoration:none}
  main{padding:24px;max-width:960px;margin:0 auto}
  table{width:100%;border-collapse:collapse;margin-top:12px}
  td,th{border:1px solid #2a2f3a;padding:8px;text-align:left}
  th{background:#1b2029}
  textarea,input,select{background:#1b2029;color:#eee;border:1px solid #2a2f3a;padding:8px;width:100%;box-sizing:border-box;font-family:inherit}
  textarea{min-height:72px}
  button{padding:10px 22px;background:#2f4dd3;color:#fff;border:0;border-radius:6px;cursor:pointer;font-size:15px}
  button:disabled{opacity:.5}
  .card{background:#161a22;border:1px solid #2a2f3a;border-radius:8px;padding:16px;margin-bottom:18px}
  .row{display:flex;gap:12px;margin-top:10px}
  .row>*{flex:1}
  #result{background:#0f1115;border:1px solid #2a2f3a;border-radius:6px;padding:12px;margin-top:10px;white-space:pre-wrap;font-family:Consolas,monospace;font-size:13px;max-height:340px;overflow:auto;display:none}
  .ok{color:#9ece6a}.bad{color:#f7768e}.dim{color:#565f73}
  a{color:#7aa2f7}
</style>
</head>
<body>
<nav>
  <a href="/">工作台</a><a href="/ui/sessions">会话时间线</a><a href="/ui/evidence">证据查看</a>
  <span style="margin-left:auto;color:#565f73">Aion Forge 控制台</span>
</nav>
<main>
  <div class="card">
    <h2 style="margin-top:0">提交任务</h2>
    <label>目标（交给 AI 的工作描述）</label>
    <textarea id="goal" placeholder="例如：编写 Node 脚本 fizzbuzz.js，打印 1 到 15（每行一个），3 的倍数输出 Fizz，5 的倍数输出 Buzz，两者倍数输出 FizzBuzz"></textarea>
    <div class="row">
      <div>
        <label>验收命令（退出码 0 = 通过；产物写在本任务工作目录）</label>
        <input id="verify" placeholder="例如：node fizzbuzz.js">
      </div>
      <div style="max-width:220px">
        <label>执行模式</label>
        <select id="mode">
          <option value="multi_step">多步模式（推荐）</option>
          <option value="codegen">单文件快速模式</option>
        </select>
      </div>
    </div>
    <p class="dim" style="font-size:13px">提示：验收命令决定"怎么算做完了"。生成产物后系统会真实执行该命令并留存证据。未填验收命令时仅按"执行不出错"判定。</p>
    <button id="go" onclick="submit()">🚀 提交并执行</button>
    <div id="result"></div>
  </div>

  <div class="card">
    <h2 style="margin-top:0">任务列表 <button style="padding:4px 12px;font-size:13px" onclick="load()">刷新</button></h2>
    <table id="tbl"><thead><tr><th>任务 ID</th><th>状态</th><th>目标</th></tr></thead><tbody></tbody></table>
    <p id="count" class="dim"></p>
  </div>
</main>
<script>
const STATUS_LABEL = {Pending:'⬜ 待处理',Planned:'📋 已规划',Executing:'⚙️ 执行中',Verifying:'🔍 验证中',Completed:'✅ 完成',Failed:'❌ 失败'};

async function submit(){
  const goal = document.getElementById('goal').value.trim();
  const cmd = document.getElementById('verify').value.trim();
  const mode = document.getElementById('mode').value;
  if(!goal){ alert('请填写目标'); return; }
  const acceptance = cmd ? [{ id:'AC-1', description:'验收命令退出码为 0', check:{ Command: cmd } }] : [];
  const body = { goal, acceptance, plan_mode: mode };
  const btn = document.getElementById('go');
  const box = document.getElementById('result');
  btn.disabled = true;
  box.style.display = 'block';
  box.textContent = '⏳ 已提交，AI 规划与执行中（通常 10~90 秒，不要关闭页面）……';
  try{
    const r = await fetch('/orchestrate', { method:'POST', headers:{'content-type':'application/json'}, body: JSON.stringify(body) });
    const j = await r.json();
    if(!r.ok){ box.innerHTML = '<span class="bad">执行失败</span>\n' + JSON.stringify(j, null, 2); }
    else {
      const ok = j.gate_passed === true;
      box.innerHTML = '<span class="' + (ok ? 'ok' : 'bad') + '">' + (ok ? '✅ 执行成功' : '❌ 未通过门禁') + '</span>\n'
        + '任务 ID: ' + j.task_id + '\n'
        + '最终状态: ' + j.final_status + ' | 步骤完成: ' + j.steps_completed
        + ' | 证据: ' + j.evidence_count + ' 条 | 重规划: ' + j.replans_used + '\n\n'
        + JSON.stringify(j, null, 2);
      document.getElementById('goal').value = '';
    }
    load();
  }catch(e){ box.innerHTML = '<span class="bad">网络错误</span> ' + e; }
  btn.disabled = false;
}

async function load(){
  const r = await fetch('/tasks');
  const j = await r.json();
  document.getElementById('count').textContent = '共 ' + j.count + ' 个任务';
  const tb = document.querySelector('#tbl tbody');
  tb.innerHTML = '';
  for(const id of j.ids.slice().reverse()){
    let status = '-', goal = '';
    try{
      const tr2 = await fetch('/tasks/' + id);
      if(tr2.ok){
        const t = await tr2.json();
        status = STATUS_LABEL[t.status] || t.status;
        goal = (t.goal || '').slice(0, 60);
      }
    }catch(e){}
    const tr = document.createElement('tr');
    tr.innerHTML = '<td>' + id + '</td><td>' + status + '</td><td class="dim">' + goal + '</td>';
    tb.appendChild(tr);
  }
}
load();
</script>
</body>
</html>
