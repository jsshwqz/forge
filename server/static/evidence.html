<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8"><title>Aion Forge · 证据查看</title>
<style>body{font-family:system-ui,sans-serif;background:#0f1115;color:#e6e6e6;margin:0}
nav{background:#161a22;padding:12px 20px;display:flex;gap:18px}nav a{color:#7aa2f7;text-decoration:none}
main{padding:24px;max-width:900px;margin:0 auto}input{background:#1b2029;color:#eee;border:1px solid #2a2f3a;padding:8px;width:340px}
button{padding:8px 14px}.kv{margin:6px 0}.kv b{color:#9ece6a}pre{background:#161a22;border:1px solid #2a2f3a;padding:12px;white-space:pre-wrap;border-radius:6px}</style></head>
<body>
<nav><a href="/">任务列表</a><a href="/ui/sessions">会话时间线</a><a href="/ui/evidence">证据查看</a></nav>
<main>
<h2>证据查看</h2>
<p>输入 Evidence ID（来自 orchestrate 响应 evidence_ids）：</p>
<input id="eid" placeholder="evidence_..."> <button onclick="load()">加载</button>
<div id="out"></div>
</main>
<script>
async function load(){
  const id=document.getElementById('eid').value.trim();
  const out=document.getElementById('out'); out.textContent='加载中...';
  const r=await fetch('/api/evidence/'+encodeURIComponent(id));
  if(!r.ok){ out.textContent='HTTP '+r.status+'（未找到该证据）'; return; }
  const e=await r.json();
  out.innerHTML=
    '<p class="kv"><b>ID:</b> '+e.id+'</p>'+
    '<p class="kv"><b>类型:</b> '+e.kind+' · <b>验收标准:</b> '+e.criterion_id+' · <b>产出方:</b> '+e.produced_by+'</p>'+
    '<p class="kv"><b>时间:</b> '+e.at+'</p>'+
    '<pre>'+e.content.replace(/</g,'&lt;')+'</pre>';
}
document.getElementById('eid').addEventListener('keydown',e=>{if(e.key==='Enter')load()});
</script>
</body></html>
