[package]
name = "forge-server"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "forge-server"
path = "src/main.rs"

[dependencies]
forge-core = { path = "../core/runtime" }
forge-task = { path = "../core/task" }
forge-session = { path = "../core/session" }
axum = "0.7"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"

[dev-dependencies]
tower = { version = "0.4", features = ["util"] }
http-body-util = "0.1"
mime = "0.3"
