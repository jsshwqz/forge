[package]
name = "forge-server"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "forge-server"
path = "src/main.rs"

[dependencies]
forge-core = { path = "../core/runtime" }
forge-task = { path = "../core/task" }
forge-session = { path = "../core/session" }
forge-storage = { path = "../storage" }
forge-artifact = { path = "../core/artifact" }
forge-sdk = { path = "../sdk" }
forge-exec = { path = "../execution/runtime" }
forge-verify = { path = "../verification/verifier" }
forge-event = { path = "../core/event" }
forge-evidence = { path = "../verification/evidence" }
forge-workspace = { path = "../execution/workspace" }
axum = "0.7"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
tokio-stream = { version = "0.1", features = ["sync"] }
futures = "0.3"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
tower = { version = "0.4", features = ["util"] }
http-body-util = "0.1"
mime = "0.3"
tempfile = "3"
