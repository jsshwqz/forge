[package]
name = "forge-server"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "forge-server"
path = "src/main.rs"

[dependencies]
forge-core = { path = "../core/runtime" }
forge-task = { path = "../core/task" }
forge-session = { path = "../core/session" }
forge-storage = { path = "../storage" }
forge-sdk = { path = "../sdk" }
forge-exec = { path = "../execution/runtime" }
forge-recovery = { path = "../recovery" }
forge-product = { path = "../products/manifest" }
forge-product-instance = { path = "../products/instance" }
forge-plan-llm = { path = "../planning/llm" }
forge-planner = { path = "../planning/planner" }
forge-api = { path = "../capability/api" }
forge-knowledge = { path = "../knowledge" }
forge-cap = { path = "../capability/registry" }
forge-verify = { path = "../verification/verifier" }
forge-event = { path = "../core/event" }
forge-evidence = { path = "../verification/evidence" }
forge-workspace = { path = "../execution/workspace" }
tower-http = { version = "0.5", features = ["cors"] }
reqwest = { version = "0.12", default-features = false, features = ["native-tls", "json"] }
axum = "0.7"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
async-trait = "0.1"
chrono = { version = "0.4", features = ["serde"] }
futures = "0.3"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
sha2 = "0.10"
semver = "1"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "postgres", "chrono", "json"] }
uuid = { version = "1", features = ["v4"] }
forge-mcp = { path = "../capability/mcp" }
forge-sandbox = { path = "../execution/sandbox" }
forge-agent = { path = "../core/agent" }
forge-tools-parsing = { path = "../tools/parsing" }
forge-tools-text = { path = "../tools/text" }
forge-tools-zl = { path = "../tools/zl" }

[dev-dependencies]
tower = { version = "0.4", features = ["util"] }
http-body-util = "0.1"
tempfile = "3"
