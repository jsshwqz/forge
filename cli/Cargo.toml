[package]
name = "forge-cli"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "Forge 统一 CLI"

[[bin]]
name = "forge"
path = "src/main.rs"

[dependencies]
forge-core = { path = "../core/runtime" }
forge-exec = { path = "../execution/runtime" }
forge-mcp = { path = "../capability/mcp" }
forge-knowledge = { path = "../knowledge" }
forge-sandbox = { path = "../execution/sandbox" }
forge-session = { path = "../core/session" }
forge-server = { path = "../server" }
forge-worklog = { path = "../tools/worklog" }
forge-tools-fs = { path = "../tools/fs" }
forge-tools-search = { path = "../tools/search" }
forge-tools-parsing = { path = "../tools/parsing" }
forge-tools-text = { path = "../tools/text" }
forge-tools-metatool = { path = "../tools/metatool" }
forge-tools-zl = { path = "../tools/zl" }
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
tokio = { version = "1", features = ["full"] }
