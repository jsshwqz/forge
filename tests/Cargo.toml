[package]
name = "forge-tests"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
forge-core = { path = "../core/runtime" }
forge-session = { path = "../core/session" }
forge-event = { path = "../core/event" }
forge-artifact = { path = "../core/artifact" }
forge-agent = { path = "../core/agent" }
forge-task = { path = "../core/task" }
forge-exec = { path = "../execution/runtime" }
forge-sandbox = { path = "../execution/sandbox" }
forge-planner = { path = "../planning/planner" }
forge-dag = { path = "../planning/dag" }
forge-verify = { path = "../verification/verifier" }
forge-evidence = { path = "../verification/evidence" }
forge-gates = { path = "../verification/gates" }
forge-recovery = { path = "../recovery" }
tokio = { version = "1", features = ["macros", "rt", "rt-multi-thread", "time", "sync"] }
serde_json = "1"
async-trait = "0.1"
chrono = { version = "0.4", features = ["serde"] }
