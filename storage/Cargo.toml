[package]
name = "forge-storage"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
forge-core = { path = "../core/runtime" }
forge-session = { path = "../core/session" }
forge-artifact = { path = "../core/artifact" }
forge-evidence = { path = "../verification/evidence" }
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "postgres", "chrono", "json"] }
async-trait = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
sha2 = "0.10"
tokio = { version = "1", features = ["sync"] }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
