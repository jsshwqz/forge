[package]
name = "forge-product"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
forge-core = { path = "../../core/runtime" }
forge-cap = { path = "../../capability/registry" }
forge-agent = { path = "../../core/agent" }
forge-gates = { path = "../../verification/gates" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
async-trait = "0.1"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt", "time", "rt-multi-thread"] }
forge-exec = { path = "../../execution/runtime" }
