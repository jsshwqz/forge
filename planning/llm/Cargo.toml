[package]
name = "forge-plan-llm"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "LLM-driven planning and replanning (V3.1)"

[dependencies]
forge-core = { path = "../../core/runtime" }
forge-task = { path = "../../core/task" }
forge-planner = { path = "../planner" }
forge-dag = { path = "../dag" }
forge-api = { path = "../../capability/api" }
forge-recovery = { path = "../../recovery" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
async-trait = "0.1"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
