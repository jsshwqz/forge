[package]
name = "forge-exec"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
forge-core = { path = "../../core/runtime" }
forge-session = { path = "../../core/session" }
forge-artifact = { path = "../../core/artifact" }
forge-agent = { path = "../../core/agent" }
tokio = { version = "1", features = ["sync", "time", "fs"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
async-trait = "0.1"
chrono = { version = "0.4", features = ["serde"] }
tracing = "0.1"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt", "time", "rt-multi-thread"] }
tempfile = "3"
